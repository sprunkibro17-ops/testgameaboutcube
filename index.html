
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cube Battle</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #171717;
  font-family: comic-sans;
  color: white;
}
#ui {
  position: fixed;
  top: 12px;
  left: 0;
  width: 100%;
  text-align: center;
  pointer-events: none;
}
#controls {
  position: fixed;
  bottom: 20px;
  width: 100%;
  display: flex;
  justify-content: space-around;
  align-items: center;
}
button {
  background: #333;
  color: white;
  border: 2px solid white;
  border-radius: 12px;
  padding: 16px;
  font-size: 20px;
  touch-action: none;
}
#shoot { background: #a22; }
#win {
  display: none;
  position: fixed;
  top: 42%;
  width: 100%;
  text-align: center;
  font-size: 30px;
  color: lime;
  font-weight: bold;
}
</style>
</head>
<body>

<div id="ui">
  <h2>Cube Battle</h2>
  <p>Hits: <span id="hits">0</span>/5</p>
</div>

<div id="win">congratulations u won</div>

<div id="controls">
  <div>
    <button data-key="w">⬆️</button><br>
    <button data-key="a">⬅️</button>
    <button data-key="s">⬇️</button>
    <button data-key="d">➡️</button>
  </div>
  <button id="shoot">THROW 🟥</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202530);

const camera = new THREE.PerspectiveCamera(
  65, window.innerWidth / window.innerHeight, 0.1, 100
);
camera.position.set(0, 9, 12);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 2));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(4, 10, 5);
scene.add(light);

// Platform
const platform = new THREE.Mesh(
  new THREE.BoxGeometry(12, 0.3, 12),
  new THREE.MeshStandardMaterial({ color: 0x777777 })
);
platform.position.y = -0.15;
scene.add(platform);

// Player
const player = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0x0066ff })
);
player.position.set(0, 0.55, 3.5);
scene.add(player);

// Enemy
const enemy = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0x00dd44 })
);
enemy.position.set(0, 0.55, -3);
scene.add(enemy);

let hits = 0;
let won = false;
let projectiles = [];

const keys = {};

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === "Space") shoot();
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

// Mobile buttons
document.querySelectorAll("[data-key]").forEach(button => {
  const key = button.dataset.key;
  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[key] = true;
  });
  button.addEventListener("pointerup", () => keys[key] = false);
  button.addEventListener("pointerleave", () => keys[key] = false);
  button.addEventListener("pointercancel", () => keys[key] = false);
});

document.getElementById("shoot").addEventListener("click", shoot);

function shoot() {
  if (won) return;

  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(0.35, 0.35, 0.35),
    new THREE.MeshStandardMaterial({ color: 0xff2222 })
  );

  cube.position.copy(player.position);

  const direction = new THREE.Vector3()
    .subVectors(enemy.position, player.position)
    .normalize();

  projectiles.push({ mesh: cube, direction: direction });
  scene.add(cube);
}

function animate() {
  requestAnimationFrame(animate);

  if (!won) {
    const speed = 0.09;

    if (keys["w"] || keys["arrowup"]) player.position.z -= speed;
    if (keys["s"] || keys["arrowdown"]) player.position.z += speed;
    if (keys["a"] || keys["arrowleft"]) player.position.x -= speed;
    if (keys["d"] || keys["arrowright"]) player.position.x += speed;

    player.position.x = THREE.MathUtils.clamp(player.position.x, -5, 5);
    player.position.z = THREE.MathUtils.clamp(player.position.z, -5, 5);
  }

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];

    p.mesh.position.addScaledVector(p.direction, 0.16);

    if (p.mesh.position.distanceTo(enemy.position) < 0.75 && !won) {
      scene.remove(p.mesh);
      projectiles.splice(i, 1);

      hits++;
      document.getElementById("hits").textContent = hits;

      if (hits >= 5) {
        scene.remove(enemy);
        won = true;
        document.getElementById("win").style.display = "block";
      }
      continue;
    }

    if (p.mesh.position.distanceTo(player.position) > 30) {
      scene.remove(p.mesh);
      projectiles.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
